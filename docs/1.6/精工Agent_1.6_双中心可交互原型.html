<style>

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 14px;overflow:auto}.tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:11px 9px;color:#6d7a73;font-size:12px;white-space:nowrap}.tab.active{color:var(--green);border-color:var(--green);font-weight:650}

.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:80px 18px minmax(0,1fr);gap:8px;min-height:54px;font-size:11px}.timeline-date{color:var(--muted);padding-top:1px}.timeline-dot{position:relative}.timeline-dot::before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#3c9471;top:3px;left:3px}.timeline-dot::after{content:"";position:absolute;top:15px;bottom:-2px;left:7px;width:1px;background:#dce5df}.timeline-item:last-child .timeline-dot::after{display:none}.timeline-text strong{font-size:12px}.timeline-text small{display:block;color:var(--muted);margin-top:2px}
.stage-list{display:grid;gap:8px}.stage{display:grid;grid-template-columns:23px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px;border:1px solid #e5ebe7;border-radius:4px;font-size:11px}.stage-num{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#eaf4ee;color:var(--green);font-size:10px;font-weight:700}.stage.current{border-color:#9bc5ad;background:#f6fbf7}.stage.done .stage-num{background:var(--green);color:#fff}.stage small{display:block;color:var(--muted);margin-top:3px}

</style>

<div class="app">

rove-case">审核通过并发布</button><button class="btn" data-action="return-case">退回补充</button></div>')+'</div></div>'}

function navigate(page){if(!names[page])return;activePage=page;render();document.getElementById("sidebar").classList.remove("open");window.scrollTo(0,0)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2400)}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-page]");if(nav){navigate(nav.dataset.page);return}const project=e.target.closest("[data-project]");if(project){selectedProject=projectRows.find(p=>p.id===project.dataset.project)||selectedProject;navigate("project-cockpit");return}const projectTabBtn=e.target.closest("[data-project-tab]");if(projectTabBtn){projectTab=projectTabBtn.dataset.projectTab;render();return}const diagTabBtn=e.target.closest("[data-diag-tab]");if(diagTabBtn){diagTab=diagTabBtn.dataset.diagTab;render();return}const action=e.target.closest("[data-action]")?.dataset.action;if(!action)return;

if(action==="run-inspection"){inspectionState="已完成";render();toast("巡检完成，生成 3 条待确认发现");return}
if(action==="confirm-findings"){toast("已确认 2 条发现，并生成关联交付事项");return}
if(action==="run-diagnosis"){if(diagnosisRunning)return;diagnosisRunning=true;toast("已启动诊断运行，正在调用 Runtime 与专家");setTimeout(()=>{diagnosisRunning=false;toast("本轮排查完成，新增 2 条证据与验证建议");if(activePage==="diag-process"||activePage==="diag-workspace")render()},2200);return}
if(action==="pause-diagnosis"){diagnosisRunning=false;toast("诊断运行已暂停");return}
if(action==="cancel-diagnosis"){diagnosisRunning=false;toast("本轮运行已结束，已有记录保留");return}
if(action==="confirm-root"){toast("已记录人工确认，诊断状态更新为待验证");return}
if(action==="reject-root"){toast("已退回根因，诊断恢复为证据收集");return}
if(action==="create-task"){toast("已生成开发任务草稿，可补充优先级后提交");return}
if(action==="run-repair-test"){const r=document.getElementById("repair-result");if(r)r.innerHTML="验证记录已保存 · 执行人：当前用户 · 环境：测试环境 · 结果：待工程师复核";toast("验证记录已保存");return}
if(action==="resolve-diagnosis"){toast("诊断已标记为待结案复核");return}
if(action==="approve-case"){toast("审核通过，案例进入知识库候选集");return}
if(action==="return-case"){toast("已退回作者补充证据与验证步骤");return}
if(action==="new-case"){document.getElementById("modal").classList.add("open");return}
if(action==="close-modal"){document.getElementById("modal").classList.remove("open");return}
if(action==="attach-evidence"){toast("已打开证据添加入口，可关联文件、日志或接口样本");return}
if(action==="evidence-detail"){toast("证据详情已展开，显示来源、脱敏和引用关系");return}
if(action==="export"){toast("原型中已生成导出任务");return}
if(action==="new-diagnosis"){diagTab="问题描述";navigate("diag-workspace");toast("已创建诊断草稿，并关联当前 DeliveryProject");return}
if(action==="new-project"){toast("新建项目表单入口已打开");return}
if(action==="new-task"||action==="new-acceptance"||action==="new-collection"){toast("编辑表单入口已打开，保存后写入项目关联记录");return}
if(action==="save-diagnosis"){toast("诊断描述已保存到独立运行记录");return}

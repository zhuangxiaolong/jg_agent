name: 0.7 质量门禁

on:
  pull_request:
  push:
    branches: [develop/desktop-poc]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 单元与集成测试
        run: npm test
      - name: Runtime 合同测试
        run: npm run test:runtime-contract
      - name: 桌面冒烟
        run: npm run test:desktop

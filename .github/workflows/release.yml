name: Windows desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建 Windows 安装包
        run: |
          npm run build
          node scripts/stage-runtime.mjs
          node scripts/release-win.mjs
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: version
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/JinggongAgent-Setup-${{ steps.version.outputs.version }}-x64.exe
            release/JinggongAgent-Setup-${{ steps.version.outputs.version }}-x64.exe.blockmap
            release/latest.yml
        env:
          GH_TOKEN: ${{ github.token }}
          JINGGONG_PUBLISH_MODE: never
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          JINGGONG_UPDATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}

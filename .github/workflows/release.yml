name: Windows desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建 Windows 安装包
        run: |
          Write-Host "开始构建无证书更新引导包；证书存在时由 release-win.mjs 启用签名。"
          npm run build
          node scripts/stage-runtime.mjs
          node scripts/release-win.mjs
        env:
          JINGGONG_PUBLISH_MODE: never
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          JINGGONG_UPDATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
      - name: 发布 GitHub Release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $files = @(
            "release/JinggongAgent-Setup-$version-x64.exe",
            "release/JinggongAgent-Setup-$version-x64.exe.blockmap",
            'release/latest.yml'
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "发布文件不存在: $file" }
          }
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --generate-notes
          }
          gh release upload '${{ github.ref_name }}' @files --clobber
        env:
          GH_TOKEN: ${{ github.token }}
